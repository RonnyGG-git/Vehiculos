spring.application.name=vehiculos
server.port=8080

# Base de datos por defecto: H2 en modo archivo (no requiere instalar nada ni permisos de administrador).
# La base se crea sola en ./data. Para usar MySQL: perfil "mysql" (ver application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/concesionario;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# API externa de tasa de cambio (gratuita, sin API key)
tasa-cambio.url=https://open.er-api.com/v6/latest/USD
# Valor de respaldo si la API no responde (pesos colombianos por 1 dólar)
tasa-cambio.respaldo=4000
# Minutos que se guarda la tasa en memoria antes de volver a consultarla
tasa-cambio.minutos-cache=60
# Tiempo máximo de espera de la API, en segundos
tasa-cambio.timeout-segundos=5
