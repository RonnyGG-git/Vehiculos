spring.application.name=vehiculos

# --- MySQL (credenciales por variables de entorno; nunca en el repo) ---
# DB_USER (default: root) y DB_PASSWORD (default: vacío)
spring.datasource.url=jdbc:mysql://localhost:3306/autodrive_motors?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:ronny}

# update: Hibernate crea/ajusta las tablas desde las entidades (sin borrar datos)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
